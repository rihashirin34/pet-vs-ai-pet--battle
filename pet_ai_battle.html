<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet AI Battle Arena 🐶🤖</title>
    <style>
        :root {
            --primary: #FF6B6B;
            --secondary: #4ECDC4;
            --accent: #FFE66D;
            --dark: #2C3E50;
            --light: #F7F9FC;
            --glass: rgba(255, 255, 255, 0.9);
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #FF9A9E 0%, #FECFEF 99%, #FECFEF 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--dark);
            overflow-x: hidden;
        }

        /* Introduction Screen */
        #intro-screen {
            background: var(--glass);
            padding: 3rem;
            border-radius: 2rem;
            text-align: center;
            box-shadow: var(--shadow);
            max-width: 500px;
            width: 90%;
            animation: float 6s ease-in-out infinite;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: -webkit-linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            width: 100%;
            padding: 1rem;
            margin: 1rem 0;
            border: 2px solid #eee;
            border-radius: 1rem;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        input:focus {
            border-color: var(--secondary);
            outline: none;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            transform: scale(1);
        }

        button:active {
            transform: scale(0.95);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        /* Game Screen */
        #game-screen {
            display: none;
            width: 95%;
            max-width: 1000px;
            height: 90vh;
            /* Fixed height for better layout on desktop */
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-radius: 2rem;
            padding: 2rem;
            box-shadow: var(--shadow);
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .pet-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 1.5rem;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        .pet-avatar {
            font-size: 8rem;
            margin-bottom: 1rem;
            filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.1));
            animation: breathe 3s ease-in-out infinite;
            cursor: pointer;
            transition: 0.2s;
        }

        .pet-avatar:active {
            transform: scale(0.9);
        }

        .pet-info h2 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .trait-badge {
            background: var(--accent);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            font-weight: bold;
            font-size: 0.9rem;
            color: #5d5d5d;
        }

        /* Stats Bars */
        .stats-container {
            width: 100%;
            margin-top: 2rem;
        }

        .stat {
            margin-bottom: 1rem;
        }

        .stat-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.3rem;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .bar-bg {
            background: #eee;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 6px;
            transition: width 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* Controls Panel */
        .controls-panel {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1rem;
        }

        .action-btn {
            background: white;
            color: var(--dark);
            border: 2px solid #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            gap: 0.5rem;
        }

        .action-btn:hover {
            border-color: var(--secondary);
            background: #fcfcfc;
        }

        .action-icon {
            font-size: 2rem;
        }

        .battle-btn {
            background: linear-gradient(135deg, #FF6B6B, #FF8E53);
            color: white;
            padding: 1.5rem;
            border: none;
            margin-top: auto;
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        /* Logs */
        .logs-container {
            background: #f8f9fa;
            border-radius: 1rem;
            padding: 1rem;
            height: 200px;
            overflow-y: auto;
            font-size: 0.9rem;
            border: 1px solid #eee;
        }

        .log-entry {
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #eee;
            animation: slideIn 0.3s ease;
        }

        /* Battle Modal */
        #battle-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .battle-arena {
            background: white;
            width: 90%;
            max-width: 800px;
            border-radius: 2rem;
            padding: 2rem;
            position: relative;
            background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%239C92AC' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E") white;
            display: flex;
            flex-direction: column;
        }

        .arena-header {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary);
        }

        .fighters {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 2rem;
        }

        .fighter {
            text-align: center;
            position: relative;
        }

        .fighter-avatar {
            font-size: 6rem;
            margin-bottom: 1rem;
            display: inline-block;
        }

        .hp-bar {
            width: 100px;
            height: 10px;
            background: #eee;
            border-radius: 5px;
            margin: 0 auto;
            overflow: hidden;
        }

        .hp-fill {
            height: 100%;
            background: #FF6B6B;
            width: 100%;
            transition: width 0.3s;
        }

        .battle-log {
            background: #2C3E50;
            color: #4ECDC4;
            padding: 1rem;
            border-radius: 1rem;
            height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            margin-bottom: 1rem;
            border: 2px solid #1a252f;
        }

        .close-battle {
            background: var(--dark);
            margin-top: 1rem;
        }

        /* Animations */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes breathe {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(255, 107, 107, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 107, 107, 0);
            }
        }

        @keyframes shake {
            0% {
                transform: translate(1px, 1px) rotate(0deg);
            }

            10% {
                transform: translate(-1px, -2px) rotate(-1deg);
            }

            20% {
                transform: translate(-3px, 0px) rotate(1deg);
            }

            30% {
                transform: translate(3px, 2px) rotate(0deg);
            }

            40% {
                transform: translate(1px, -1px) rotate(1deg);
            }

            50% {
                transform: translate(-1px, 2px) rotate(-1deg);
            }

            60% {
                transform: translate(-3px, 1px) rotate(0deg);
            }

            70% {
                transform: translate(3px, 1px) rotate(-1deg);
            }

            80% {
                transform: translate(-1px, -1px) rotate(1deg);
            }

            90% {
                transform: translate(1px, 2px) rotate(0deg);
            }

            100% {
                transform: translate(1px, -2px) rotate(-1deg);
            }
        }

        @keyframes hit {
            0% {
                transform: scale(1);
                filter: hue-rotate(0deg);
            }

            50% {
                transform: scale(0.8);
                filter: hue-rotate(90deg);
            }

            100% {
                transform: scale(1);
                filter: hue-rotate(0deg);
            }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Toast Notification */
        #toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--dark);
            color: white;
            padding: 1rem 2rem;
            border-radius: 2rem;
            box-shadow: var(--shadow);
            opacity: 0;
            transition: 0.5s;
            z-index: 200;
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 768px) {
            #game-screen {
                grid-template-columns: 1fr;
                height: auto;
                min-height: 90vh;
                padding: 1rem;
            }

            .pet-avatar {
                font-size: 6rem;
            }
        }
    </style>
</head>

<body>

    <!-- Intro Screen -->
    <div id="intro-screen">
        <h1>Pet AI Battle Arena 🐶🤖</h1>
        <p>Give life to a chaotic AI pet and watch them fight!</p>
        <div style="font-size: 4rem; margin: 1rem;">🥚</div>
        <input type="text" id="pet-name-input" placeholder="Give your pet a name..." maxlength="12">
        <button onclick="Sound.btnClick(); startGame()">Hatch Pet!</button>
    </div>

    <!-- Game Screen -->
    <div id="game-screen">
        <!-- Left Panel: Pet Visual -->
        <div class="pet-display">
            <div class="pet-avatar" id="pet-visual" onclick="petInteraction()">🦄</div>
            <div class="pet-info">
                <h2 id="pet-name-display">Sparky</h2>
                <span class="trait-badge" id="pet-trait">✨ Randomly Chaotic</span>
            </div>

            <div class="stats-container">
                <div class="stat">
                    <div class="stat-header">
                        <span>❤️ Health</span> <span id="val-health">100/100</span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" id="bar-health" style="width: 100%; background: #FF6B6B;"></div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-header">
                        <span>⚡ Energy</span> <span id="val-energy">100/100</span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" id="bar-energy" style="width: 100%; background: #FFE66D;"></div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-header">
                        <span>🍗 Hunger</span> <span id="val-hunger">100/100</span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" id="bar-hunger" style="width: 100%; background: #4ECDC4;"></div>
                    </div>
                </div>
                <div class="stat">
                    <div class="stat-header">
                        <span>😂 Fun</span> <span id="val-fun">100/100</span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" id="bar-fun" style="width: 100%; background: #c7f464;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Panel: Controls -->
        <div class="controls-panel">
            <div class="logs-container" id="game-logs">
                <div class="log-entry">🥚 Egg hatched! Welcome to the world.</div>
            </div>

            <div class="actions-grid">
                <button class="action-btn" onclick="Sound.btnClick(); trainPet('strength')">
                    <span class="action-icon">🏋️</span>
                    Train Strength
                </button>
                <button class="action-btn" onclick="Sound.btnClick(); trainPet('trick')">
                    <span class="action-icon">🎩</span>
                    Teach Trick
                </button>
                <button class="action-btn" onclick="Sound.btnClick(); feedPet()">
                    <span class="action-icon">🍕</span>
                    Feed
                </button>
                <button class="action-btn" onclick="Sound.btnClick(); sleepPet()">
                    <span class="action-icon">💤</span>
                    Nap
                </button>
            </div>

            <button class="battle-btn" onclick="Sound.btnClick(); startBattleInit()">⚔️ Find Opponent ⚔️</button>
        </div>
    </div>

    <!-- Battle Modal -->
    <div id="battle-modal">
        <div class="battle-arena">
            <div class="arena-header">🏆 BATTLE ARENA 🏆</div>

            <div class="fighters">
                <div class="fighter">
                    <div class="fighter-avatar" id="fighter-p1">🦄</div>
                    <h3>YOU</h3>
                    <div class="hp-bar">
                        <div class="hp-fill" id="hp-p1"></div>
                    </div>
                </div>
                <div style="font-size: 2rem; font-weight: bold;">VS</div>
                <div class="fighter">
                    <div class="fighter-avatar" id="fighter-p2">🦖</div>
                    <h3 id="fighter-p2-name">Enemy</h3>
                    <div class="hp-bar">
                        <div class="hp-fill" id="hp-p2"></div>
                    </div>
                </div>
            </div>

            <div class="battle-log" id="battle-log">
                Waiting for battle to start...
            </div>

            <button class="close-battle" id="close-battle-btn" onclick="Sound.btnClick(); closeBattle()"
                style="display:none;">Return Home</button>
        </div>
    </div>

    <div id="toast">Log message here</div>

    <script>
        // --- Game Data & Configuration ---
        const PET_TYPES = ['🦄', '🦖', '🐙', '👾', '🤖', '🐸', '🦁', '🦉', '🦊', '🐹', '🐢', '🐉'];
        const TRAITS = [
            { name: 'Zoomie Master', desc: 'Attacks twice sometimes', type: 'speed' },
            { name: 'Gassy', desc: 'Uses poison attacks', type: 'poison' },
            { name: 'Tanky', desc: 'Takes less damage', type: 'defense' },
            { name: 'Dramatic', desc: 'Heals when low HP', type: 'healing' },
            { name: 'Distracted', desc: 'Sometimes does nothing', type: 'random' },
            { name: 'Salty', desc: 'Critical hits more often', type: 'crit' }
        ];

        const MOVES = {
            basic: [
                { name: "Bonk", text: "bonked the enemy!", dmg: 10 },
                { name: "Nibble", text: "nibbled the enemy's toe.", dmg: 8 },
                { name: "Slap", text: "slapped with attitude.", dmg: 12 },
            ],
            special: [
                { name: "Fart Cloud", text: "released a toxic gas cloud! 🤢", dmg: 20, style: "yuck" },
                { name: "Cuteness Overload", text: "made puppy eyes! It's super effective!", dmg: 25, style: "aww" },
                { name: "Existential Dread", text: "explained taxes to the enemy. Emotional Damage!", dmg: 30, style: "dark" },
                { name: "Zoomies", text: "ran in circles until they crashed into the enemy!", dmg: 22, style: "speed" },
                { name: "Trash Can Armor", text: "put a bucket on their head. Defense up! (But still attacks)", dmg: 5, buff: "def" },
                { name: "Meme Power", text: "showed a cursed image. Critical Logic Error!", dmg: 35, style: "glitch" }
            ]
        };

        // --- Game State ---
        let pet = {
            name: "",
            skin: "🐶",
            trait: {},
            stats: {
                health: 100,
                maxHealth: 100,
                energy: 100,
                hunger: 100,
                fun: 100,
                strength: 1,
                iq: 1
            },
            level: 1,
            wins: 0
        };

        let enemy = {};
        let battleActive = false;
        let turnTimer = null;

        // --- SOUND SYSTEM ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();

        const Sound = {
            playTone: (freq, type, duration, vol = 0.1) => {
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(vol, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            },

            btnClick: () => Sound.playTone(600, 'sine', 0.1),
            hatch: () => {
                Sound.playTone(400, 'triangle', 0.1);
                setTimeout(() => Sound.playTone(600, 'triangle', 0.1), 100);
                setTimeout(() => Sound.playTone(800, 'triangle', 0.2), 200);
            },
            happy: () => {
                Sound.playTone(500, 'sine', 0.1);
                setTimeout(() => Sound.playTone(700, 'sine', 0.2), 150);
            },
            sad: () => {
                Sound.playTone(400, 'sawtooth', 0.3);
                setTimeout(() => Sound.playTone(300, 'sawtooth', 0.4), 200);
            },
            train: () => {
                Sound.playTone(300, 'square', 0.1);
                setTimeout(() => Sound.playTone(300, 'square', 0.1), 100);
            },
            battleStart: () => {
                Sound.playTone(200, 'sawtooth', 0.5);
                setTimeout(() => Sound.playTone(150, 'sawtooth', 0.5), 200);
                setTimeout(() => Sound.playTone(100, 'sawtooth', 0.8), 400);
            },
            hit: () => {
                // Dramatic impact noise-ish
                if (ctx.state === 'suspended') ctx.resume();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            },
            win: () => {
                [400, 500, 600, 800].forEach((f, i) => setTimeout(() => Sound.playTone(f, 'sine', 0.3, 0.2), i * 150));
            }
        };

        // --- Helper Functions ---
        function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function delay(ms) { return new Promise(res => setTimeout(res, ms)); }

        function log(msg, type = 'neutral') {
            const logs = document.getElementById('game-logs');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = msg;
            logs.prepend(entry);
            // Limit log size
            if (logs.children.length > 20) logs.lastChild.remove();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'show';
            setTimeout(() => t.className = '', 2000);
        }

        function updateUI() {
            // Update Bars
            document.getElementById('bar-health').style.width = `${(pet.stats.health / pet.stats.maxHealth) * 100}%`;
            document.getElementById('bar-energy').style.width = `${pet.stats.energy}%`;

            // Color shifts for low stats
            document.getElementById('bar-hunger').style.width = `${pet.stats.hunger}%`;
            document.getElementById('bar-hunger').style.background = pet.stats.hunger < 30 ? '#ff4757' : '#4ECDC4';

            document.getElementById('bar-fun').style.width = `${pet.stats.fun}%`;
            document.getElementById('bar-fun').style.background = pet.stats.fun < 30 ? '#57606f' : '#c7f464';

            // Text Values
            document.getElementById('val-health').textContent = `${Math.ceil(pet.stats.health)}/${pet.stats.maxHealth}`;
            document.getElementById('val-energy').textContent = `${Math.ceil(pet.stats.energy)}%`;
            document.getElementById('val-hunger').textContent = `${Math.ceil(pet.stats.hunger)}%`;
            document.getElementById('val-fun').textContent = `${Math.ceil(pet.stats.fun)}%`;

            // Avatar Animation State
            const avatar = document.getElementById('pet-visual');
            if (pet.stats.energy < 20) {
                avatar.style.animation = 'none';
                avatar.style.opacity = '0.6';
                avatar.textContent = '💤'; // Sleepy fallback if needed
            } else {
                avatar.style.animation = 'breathe 3s ease-in-out infinite';
                avatar.style.opacity = '1';
                avatar.textContent = pet.skin;
            }
        }

        // --- Core Mechanics ---

        function startGame() {
            const name = document.getElementById('pet-name-input').value.trim() || "Glitchy";
            pet.name = name;
            pet.skin = pick(PET_TYPES);
            pet.trait = pick(TRAITS);

            // Setup UI
            document.getElementById('pet-name-display').textContent = pet.name;
            document.getElementById('pet-trait').textContent = `✨ ${pet.trait.name}`;
            document.getElementById('pet-visual').textContent = pet.skin;
            document.getElementById('pet-trait').title = pet.trait.desc;

            // Transistion
            document.getElementById('intro-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'grid'; // Grid for desktop layout

            Sound.hatch();
            log(`🌟 ${pet.name} matches the ${pet.trait.name} personality!`);

            // Start Stat Decay Loop
            setInterval(gameLoop, 5000);
            updateUI();
        }

        function gameLoop() {
            if (battleActive) return; // Pause decay during battle

            pet.stats.hunger = Math.max(0, pet.stats.hunger - 2);
            pet.stats.fun = Math.max(0, pet.stats.fun - 3);
            pet.stats.energy = Math.min(100, pet.stats.energy + 1); // Slow passive regen

            if (pet.stats.hunger === 0 || pet.stats.fun === 0) {
                pet.stats.health = Math.max(0, pet.stats.health - 2);
                if (Math.random() < 0.1) log(`⚠️ ${pet.name} is not having a good time...`);
            }

            updateUI();
        }

        // --- Actions ---

        function petInteraction() {
            pet.stats.fun = Math.min(100, pet.stats.fun + 5);
            log(`💖 ${pet.name} purrs (or beeps).`);
            playAnim('bounce');
            Sound.happy();
            updateUI();
        }

        function trainPet(type) {
            if (pet.stats.energy < 15) {
                showToast("Too tired to train!");
                Sound.sad();
                return;
            }

            Sound.train();
            pet.stats.energy -= 15;
            pet.stats.hunger -= 10;

            if (type === 'strength') {
                pet.stats.strength += 0.5;
                log(`💪 ${pet.name} lifted a heavy stick. Strength +0.5`);
            } else {
                pet.stats.iq += 0.5;
                log(`🧠 ${pet.name} read a wiki article. IQ +0.5`);
            }
            playAnim('shake');
            updateUI();
        }

        function feedPet() {
            if (pet.stats.hunger >= 95) {
                showToast("Not hungry!");
                return;
            }
            Sound.happy();
            pet.stats.hunger = Math.min(100, pet.stats.hunger + 30);
            pet.stats.health = Math.min(pet.stats.maxHealth, pet.stats.health + 5);
            log(`🍎 Included necessary nutrients.`);
            playAnim('bounce');
            updateUI();
        }

        function sleepPet() {
            pet.stats.energy = 100;
            log(`💤 ${pet.name} had a power nap.`);
            document.getElementById('intro-screen').style.filter = "brightness(0.5)"; // visual flash
            setTimeout(() => document.getElementById('intro-screen').style.filter = "none", 200);
            updateUI();
        }

        function playAnim(anim) {
            const v = document.getElementById('pet-visual');
            v.style.animation = 'none';
            v.offsetHeight; /* trigger reflow */
            v.style.animation = `${anim} 0.5s`;
            setTimeout(() => {
                if (pet.stats.energy > 20) v.style.animation = 'breathe 3s ease-in-out infinite';
            }, 500);
        }

        // --- BATTLE SYSTEM ---

        function startBattleInit() {
            if (pet.stats.health < 20) {
                showToast("Too weak to battle! Heal first.");
                return;
            }

            battleActive = true;
            document.getElementById('battle-modal').style.display = 'flex';
            document.getElementById('close-battle-btn').style.display = 'none';

            // Generate Enemy
            const eNames = ["Evil Toaster", "Glitch Goblin", "Turbo Snail", "Space Karen", "Internet Troll"];
            enemy = {
                name: pick(eNames),
                skin: pick(PET_TYPES),
                maxHp: 80 + (pet.level * 10),
                hp: 80 + (pet.level * 10),
                strength: pet.stats.strength * rnd(0.8, 1.2)
            };

            // Setup Arena for Player
            pet.battleHp = pet.stats.health;
            document.getElementById('fighter-p1').textContent = pet.skin;
            document.getElementById('hp-p1').style.width = '100%';

            // Setup Arena for Enemy
            document.getElementById('fighter-p2').textContent = enemy.skin;
            document.getElementById('fighter-p2-name').textContent = enemy.name;
            document.getElementById('hp-p2').style.width = '100%';

            document.getElementById('battle-log').innerHTML = "Battle Start!<br>";

            Sound.battleStart();
            setTimeout(battleTurn, 1000);
        }

        async function battleTurn() {
            if (!battleActive) return;

            // --- PLAYER TURN ---
            await delay(800);
            let move = chooseMove(pet);

            // Trait check
            if (pet.trait.type === 'crit' && Math.random() < 0.3) {
                move.dmg *= 1.5;
                move.text += " (CRITICAL HIT!)";
            }

            // Logic: Higher strength increases base dmg slightly
            let finalDmg = Math.floor(move.dmg + (pet.stats.strength / 2));
            enemy.hp -= finalDmg;

            Sound.hit();
            battleLog(`👉 ${pet.name} ${move.text} [-${finalDmg} HP]`);
            animHit('fighter-p2');
            updateBattleUI();

            if (enemy.hp <= 0) {
                endBattle(true);
                return;
            }

            // --- ENEMY TURN ---
            await delay(1200);

            // Trait: Distracted (Enemy might do nothing if player is cute?)
            // Keeping it simple for now:

            let eMove = pick([...MOVES.basic, ...MOVES.special]);
            let eDmg = Math.floor(eMove.dmg);

            // Trait Defense Check
            if (pet.trait.type === 'defense') eDmg = Math.floor(eDmg * 0.8);

            pet.battleHp -= eDmg;

            Sound.hit();
            battleLog(`👹 ${enemy.name} ${eMove.text} [-${eDmg} HP]`);
            animHit('fighter-p1');
            updateBattleUI();

            if (pet.battleHp <= 0) {
                endBattle(false);
                return;
            }

            // Next loop
            setTimeout(battleTurn, 500);
        }

        function chooseMove(actor) {
            // "AI" logic - mostly random but weighted by "IQ" for player
            if (Math.random() < (actor.stats.iq * 0.05) || Math.random() < 0.3) {
                return pick(MOVES.special);
            }
            return pick(MOVES.basic);
        }

        function animHit(id) {
            const el = document.getElementById(id);
            el.style.animation = 'hit 0.3s';
            setTimeout(() => el.style.animation = '', 300);
        }

        function battleLog(msg) {
            const bLog = document.getElementById('battle-log');
            bLog.innerHTML += `<div>${msg}</div>`;
            bLog.scrollTop = bLog.scrollHeight;
        }

        function updateBattleUI() {
            const p1Pct = Math.max(0, (pet.battleHp / pet.stats.maxHealth) * 100);
            const p2Pct = Math.max(0, (enemy.hp / enemy.maxHp) * 100);

            document.getElementById('hp-p1').style.width = `${p1Pct}%`;
            document.getElementById('hp-p2').style.width = `${p2Pct}%`;
        }

        function endBattle(playerWon) {
            battleActive = false;
            const btn = document.getElementById('close-battle-btn');

            if (playerWon) {
                battleLog(`<br><strong style="color:#ffeaa7">🏆 VICTORY! ${pet.name} wins!</strong>`);
                pet.wins++;
                pet.stats.fun = 100;
                log(`🏆 Won battle against ${enemy.name}!`);
                playAnim('bounce');
                Sound.win();
            } else {
                battleLog(`<br><strong style="color:#ff7675">💀 DEFEAT... ${pet.name} fainted.</strong>`);
                pet.stats.health = 1;
                pet.stats.energy = 0;
                log(`💀 Lost battle against ${enemy.name}. Needs rest.`);
                Sound.sad();
            }

            // Synchronize health back
            pet.stats.health = Math.max(1, pet.battleHp);
            updateUI();

            btn.style.display = 'block';
        }

        function closeBattle() {
            document.getElementById('battle-modal').style.display = 'none';
        }

    </script>
</body>

</html>
